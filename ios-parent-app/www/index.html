<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>H-Music</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7fb;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(420px, calc(100vw - 40px));
        padding: 36px 28px;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
      }

      .icon {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        background: #050505 url("./hmusic-icon.png") center / cover no-repeat;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 22px;
        color: #4b5563;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 8px;
        background: #4f46e5;
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true"></div>
      <h1>H-Music</h1>
      <p>Open the H-Music parent app to view lessons, messages, homework, reschedules, and billing.</p>
      <a href="https://hmusic-crm.onrender.com/app">Open Parent App</a>
    </main>
  </body>
</html>
