<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>H-Music</title>
    <script>
      window.setTimeout(function () {
        window.location.replace("https://hmusic-crm.onrender.com/parent_login?native_app=1");
      }, 800);
    </script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(22px, env(safe-area-inset-top)) 22px max(26px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% -10%, rgba(255, 218, 64, 0.42), transparent 34%),
          linear-gradient(180deg, #fff8d6 0%, #f7f7fb 42%, #ffffff 100%);
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(430px, 100%);
        padding: 34px 26px 28px;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid rgba(17, 24, 39, 0.08);
        box-shadow: 0 22px 60px rgba(15, 23, 42, 0.12);
      }

      .icon {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: #050505 url("./hmusic-icon.png") center / cover no-repeat;
        margin-bottom: 24px;
        box-shadow: 0 14px 30px rgba(17, 24, 39, 0.18);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        background: #ffda40;
        color: #111827;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 36px;
        line-height: 1.03;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: #4b5563;
        line-height: 1.5;
      }

      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 8px;
        background: #111827;
        color: #ffda40;
        font-weight: 800;
        box-shadow: 0 12px 24px rgba(17, 24, 39, 0.16);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true"></div>
      <div class="eyebrow">Parent App</div>
      <h1>H-Music</h1>
      <p>Lessons, messages, homework, reschedules, and billing for H-Music families.</p>
      <div class="status">Opening Parent App...</div>
    </main>
  </body>
</html>
