<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-Music 网站管理</title>
<style>body{margin:0;background:#f4f5f7;color:#20343b;font:16px system-ui}header{padding:20px 4%;background:white;border-bottom:1px solid #ddd;display:flex;gap:15px;align-items:center;flex-wrap:wrap}h1{font-size:23px;margin:0 auto 0 0}main{max-width:1200px;margin:25px auto;display:grid;grid-template-columns:300px 1fr;gap:24px;padding:0 20px}aside,article{background:white;border-radius:12px;padding:20px}button,input,select,textarea{font:inherit;border:1px solid #cbd2d8;border-radius:6px;padding:10px;box-sizing:border-box}button{cursor:pointer;background:white}button.primary{background:#275b62;color:white}label{display:block;margin:16px 0 6px}input,textarea,select{width:100%}textarea{min-height:240px}#list button{display:block;width:100%;text-align:left;margin:6px 0}#list button.active{background:#e4f1f2;border-color:#275b62}.row{display:flex;gap:12px}.row>div{flex:1}#status{padding:12px 4%;min-height:22px}a{color:#275b62}small{color:#626b74}#image{max-height:150px;max-width:100%;display:block;margin-top:10px}@media(max-width:700px){main{grid-template-columns:1fr}.row{display:block}}</style>
<header><h1>H-Music 网站管理</h1><a href="https://www.hmusicandart.com" target="_blank" rel="noopener">查看网站 ↗</a><button id="save">保存草稿</button><button id="publish" class="primary">发布到网站</button></header><div id="status" role="status">正在读取…</div>
<main><aside><input id="search" placeholder="搜索页面"><select id="filter"><option value="">所有分类</option></select><button id="add">＋ 新增页面</button><div id="list"></div></aside><article id="editor" hidden><h2>编辑页面</h2><small>保存草稿不会修改线上内容。点击发布后，网站通常在 30 秒内更新。</small><label for="title">英文标题</label><input id="title"><label for="titleZh">中文标题（可选）</label><input id="titleZh"><div class="row"><div><label for="category">分类</label><select id="category"></select></div><div><label for="hidden">页面状态</label><select id="hidden"><option value="false">上线显示</option><option value="true">下架隐藏</option></select></div></div><label for="summary">英文简介</label><input id="summary"><label for="summaryZh">中文简介</label><input id="summaryZh"><label for="text">正文</label><textarea id="text"></textarea><small>正文修改后以文字段落展示；未修改的页面保留现有图文排版。</small><label for="imageUrl">封面图片（HTTPS 地址）</label><input id="imageUrl"><label for="upload">或上传封面（PNG / JPEG / WebP，最大 1 MB）</label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><img id="image" alt="封面预览"><p><a id="preview" target="_blank" rel="noopener">打开当前线上页面 ↗</a></p></article></main>
<script>
const csrf='__CSRF__', $=id=>document.getElementById(id), cats={programs:'课程',teachers:'老师',about:'关于学校',events:'活动',resources:'家长资源',services:'服务',careers:'招聘'};let pages=[],revision=0,current=null,dirty=false,busy=false;
for(const [key,label] of Object.entries(cats))for(const id of ['category','filter'])$(id).add(new Option(label,key));
function status(t){$('status').textContent=t}function change(){dirty=true;status('有未保存的修改')}function capture(){if(!current)return;if($('title').value!==current.title||$('titleZh').value!==(current.titleZh||''))current.customTitle=true;for(const key of ['title','titleZh','category','summary','summaryZh'])current[key]=$(key).value;current.hidden=$('hidden').value==='true';if($('text').value!==current.text){current.text=$('text').value;current.editorText=current.text}const url=$('imageUrl').value.trim();if(url!==((current.images||[])[0]||''))current.images=url?[url,...(current.images||[]).slice(1)]:[];}
function render(){const list=$('list');list.replaceChildren();for(const p of pages.filter(p=>(!$('filter').value||p.category===$('filter').value)&&p.title.toLowerCase().includes($('search').value.toLowerCase()))){const b=document.createElement('button');b.textContent=(p.hidden?'[已下架] ':'')+p.title;b.className=p===current?'active':'';b.onclick=()=>{capture();current=p;show();render()};list.append(b)}}
function show(){$('editor').hidden=!current;if(!current)return;for(const key of ['title','titleZh','category','summary','summaryZh','text'])$(key).value=current[key]||'';$('hidden').value=String(!!current.hidden);$('imageUrl').value=(current.images||[])[0]||'';image();$('preview').href='https://www.hmusicandart.com/page.html?id='+encodeURIComponent(current.id)}
function image(){let url=$('imageUrl').value;$('image').src=url.startsWith('assets/')?'https://www.hmusicandart.com/'+url:url;$('image').hidden=!url}
for(const id of ['title','titleZh','category','summary','summaryZh','text','hidden','imageUrl'])$(id).oninput=()=>{change();if(id==='imageUrl')image()};$('search').oninput=render;$('filter').onchange=render;
$('add').onclick=()=>{capture();current={id:'page-'+Date.now(),title:'New page',category:'programs',text:'',editorText:'',images:[],hidden:true};pages.push(current);show();render();change()};
$('upload').onchange=async()=>{const f=$('upload').files[0];if(!f)return;if(f.size>1048576||!['image/png','image/jpeg','image/webp'].includes(f.type))return status('请选择不超过 1 MB 的 PNG/JPEG/WebP 图片');const reader=new FileReader();reader.onload=()=>{$('imageUrl').value=reader.result;image();change()};reader.readAsDataURL(f)};
async function save(publish){if(busy)return;capture();busy=true;$('save').disabled=$('publish').disabled=true;try{const r=await fetch('/api/website/admin',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify({pages,revision,publish})});const data=await r.json();if(!r.ok)throw Error(data.error||'保存失败，请刷新登录后重试');revision=data.revision;dirty=false;render();status(publish?'已发布，网站将在约 30 秒内更新。':'草稿已保存。')}catch(e){status(e.message)}finally{busy=false;$('save').disabled=$('publish').disabled=false}}
$('save').onclick=()=>save(false);$('publish').onclick=()=>save(true);window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
fetch('/api/website/admin').then(async r=>{if(!r.ok)throw Error('请先登录管理员账号');return r.json()}).then(d=>{pages=d.pages;revision=d.revision;current=pages[0];show();render();status('已载入 '+pages.length+' 个页面。')}).catch(e=>status(e.message));
</script></html>
