<style>.admissions-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid #e3e7ef;background:#fff;font:14px/1.5 system-ui,sans-serif}.admissions-nav ~ main > header nav{display:none}.admissions-nav strong{color:#26354d;margin-right:16px}.admissions-nav a{padding:8px 12px;border-radius:8px;color:#53627b;text-decoration:none}.admissions-nav a[aria-current="page"]{background:#f0edfc;color:#6857d9;font-weight:650}.admissions-nav a:focus-visible{outline:3px solid #a89ee9;outline-offset:2px}@media(max-width:650px){.admissions-nav{padding:12px 16px}.admissions-nav strong{width:100%}}</style>
<nav class="admissions-nav" aria-label="Admissions & enrollment"><strong>Admissions & enrollment</strong>{% for key,url,label in [('intake','/admissions','Inquiries & trials'),('classes','/group-class-admin','Classes & registration'),('applications','/group-enrollments','Application review')] %}<a href="{{ url }}"{% if admissions_tab == key %} aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}<a href="/admissions-admin">Tuition, discounts & payments</a><a href="/website-admin">Website editor</a></nav>
