<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title|default('Group Classes · H-Music') }}</title>
<style>
:root{font-family:Arial,system-ui;color:#192b3c;background:#f5f7fb;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:30px auto;padding:0 24px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}h1{font-size:30px;margin:8px 0}h2{font-size:21px;margin:0 0 16px}h3{font-size:17px}p{line-height:1.6}.brand{font-weight:800;font-size:21px;color:#1b3b5e}a{color:#216bb2}nav{display:flex;gap:14px;flex-wrap:wrap}.card{background:#fff;border:1px solid #dae2ec;padding:24px;border-radius:16px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.grid>.card{margin:0}.muted,small{color:#617187}.price{font-size:28px;font-weight:750}.button,button{background:#216bb2;color:white;border:0;border-radius:9px;padding:12px 18px;font:600 14px Arial;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.secondary{background:#edf2f9;color:#24496d}.danger{background:#fff1ef;color:#a52621}label{display:block;font-weight:600;margin:16px 0 6px}input:not([type=checkbox]),textarea,select{width:100%;padding:11px;border:1px solid #becbdc;border-radius:8px;font:16px Arial;margin-top:6px}textarea{min-height:90px}input[type=checkbox]{width:18px;height:18px;vertical-align:middle;margin-right:8px}.check{font-weight:400}.error{background:#fff0ee;border:1px solid #f0b3aa;padding:16px;border-radius:10px;color:#9d2820}.notice{background:#edf6ff;padding:16px;border-radius:10px}.badge{background:#ede7fc;color:#633da2;padding:5px 9px;border-radius:20px;font-size:12px;display:inline-block}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:12px;vertical-align:top}th{color:#617187}details>summary{cursor:pointer;font-weight:600;padding:8px 0}.dates{display:flex;flex-wrap:wrap;gap:8px}.date{background:#f0f4fa;border-radius:6px;padding:6px 10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.policy{white-space:pre-wrap;background:#f6f8fb;border-radius:8px;padding:16px}.scroll{overflow:auto}.hidden{position:absolute;left:-9999px}form{margin:0}.session-picker{max-height:340px;overflow:auto;border:1px solid #dce5ef;padding:12px;border-radius:9px}.session-picker label{border-bottom:1px solid #eee;padding:8px;margin:0;font-size:14px;font-weight:400}.review-form{max-width:650px}button:focus,a:focus,input:focus,select:focus,textarea:focus{outline:3px solid #8ac4ff;outline-offset:2px}@media(max-width:650px){main{padding:0 14px}header{display:block}.card{padding:18px}h1{font-size:25px}nav{margin-top:16px}}
</style>
</head>
<body>
<main>
<header>
<div>
<div class="brand">H-Music & Art</div>
<span class="muted">Group class enrollment</span>
</div>
<nav>{% block nav %}<a href="https://www.hmusicandart.com/page.html?id=enroll-a-piano-group-class-35">School website</a>
<a href="/group-classes">All classes</a>{% endblock %}</nav>
</header>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% block content %}
{% endblock %}<p class="muted">Questions? <a href="mailto:info@h-musicandarts.com">info@h-musicandarts.com</a>
</p>
</main>
</body>
</html>
